# Duplicates shairport-sync's stereo output to the real DAC/HDMI device
# AND the snd-aloop "loopback" capture device (hw:loopback,0,1), so a
# separate process can read the live audio for FFT/amplitude analysis
# without touching the playback path.
#
# Each "tap_*_out" device is what shairport-sync's output_device should be
# set to. Install with: sudo cp system_config/asound.conf /etc/asound.conf

pcm.tap_hifiberry {
	type multi;
	slaves.a.pcm "iec958:CARD=sndrpihifiberry,DEV=0";
	slaves.a.channels 2;
	slaves.b.pcm "hw:loopback,0,0";
	slaves.b.channels 2;
	bindings.0 { slave a; channel 0; }
	bindings.1 { slave a; channel 1; }
	bindings.2 { slave b; channel 0; }
	bindings.3 { slave b; channel 1; }
}

pcm.tap_hifiberry_out {
	type route;
	slave.pcm "tap_hifiberry";
	slave.channels 4;
	ttable.0.0 1;
	ttable.1.1 1;
	ttable.0.2 1;
	ttable.1.3 1;
}

pcm.tap_hdmi1 {
	type multi;
	slaves.a.pcm "hdmi:CARD=vc4hdmi0,DEV=0";
	slaves.a.channels 2;
	slaves.b.pcm "hw:loopback,0,0";
	slaves.b.channels 2;
	bindings.0 { slave a; channel 0; }
	bindings.1 { slave a; channel 1; }
	bindings.2 { slave b; channel 0; }
	bindings.3 { slave b; channel 1; }
}

pcm.tap_hdmi1_out {
	type route;
	slave.pcm "tap_hdmi1";
	slave.channels 4;
	ttable.0.0 1;
	ttable.1.1 1;
	ttable.0.2 1;
	ttable.1.3 1;
}

pcm.tap_hdmi2 {
	type multi;
	slaves.a.pcm "hdmi:CARD=vc4hdmi1,DEV=0";
	slaves.a.channels 2;
	slaves.b.pcm "hw:loopback,0,0";
	slaves.b.channels 2;
	bindings.0 { slave a; channel 0; }
	bindings.1 { slave a; channel 1; }
	bindings.2 { slave b; channel 0; }
	bindings.3 { slave b; channel 1; }
}

pcm.tap_hdmi2_out {
	type route;
	slave.pcm "tap_hdmi2";
	slave.channels 4;
	ttable.0.0 1;
	ttable.1.1 1;
	ttable.0.2 1;
	ttable.1.3 1;
}
